name: Build and Push to GHCR

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/fedor-afrin/asterisk-veb-backend:latest
            ghcr.io/fedor-afrin/asterisk-veb-backend:${{ github.sha }}

      - name: Build and push Asterisk image
        uses: docker/build-push-action@v5
        with:
          context: ./asterisk
          file: ./asterisk/Dockerfile
          push: true
          tags: |
            ghcr.io/fedor-afrin/asterisk-veb-asterisk:latest
            ghcr.io/fedor-afrin/asterisk-veb-asterisk:${{ github.sha }}