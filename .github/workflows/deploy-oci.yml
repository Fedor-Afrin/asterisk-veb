name: Build and Push All Images to OCI

on:
  push:
    branches:
      - main
      - master

env:
  OCI_REGION: il-jerusalem-1.ocir.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Oracle Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCI_REGION }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      # --- Сборка и пуш Бэкенда ---
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.OCI_REGION }}/${{ secrets.OCI_NAMESPACE }}/fast-api-pbx-backend:latest
            ${{ env.OCI_REGION }}/${{ secrets.OCI_NAMESPACE }}/fast-api-pbx-backend:${{ github.sha }}

      # --- Сборка и пуш Астериска ---
      - name: Build and push Asterisk image
        uses: docker/build-push-action@v5
        with:
          context: ./asterisk
          file: ./asterisk/Dockerfile
          push: true
          tags: |
            ${{ env.OCI_REGION }}/${{ secrets.OCI_NAMESPACE }}/fast-api-pbx-asterisk:latest
            ${{ env.OCI_REGION }}/${{ secrets.OCI_NAMESPACE }}/fast-api-pbx-asterisk:${{ github.sha }}