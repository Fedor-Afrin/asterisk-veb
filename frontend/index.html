<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asterisk Admin Panel - Управление номерами</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <h1>Панель администратора АТС</h1>
        
        <!-- Блок создания номера -->
        <div class="card">
            <h2>Создать SIP-номер</h2>
            <form id="extForm">
                <input type="number" id="extNumber" placeholder="Номер (например, 101)" required>
                
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="text" id="extSecret" placeholder="Пароль (мин. 6 символов)" required style="margin-bottom: 0; flex: 1;">
                    <button type="button" id="generateBtn" style="background-color: #6c757d; width: auto; padding: 0 15px;">Сгенерировать</button>
                </div>
                
                <input type="text" id="extCallerId" placeholder="Caller ID (например, Office Phone <101>)" required>
                
                <label for="extTransport" style="display: block; margin-top: 10px; font-weight: bold; font-size: 14px;">Транспорт SIP:</label>
                <select id="extTransport" style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px;">
                    <option value="transport-tls">TLS (Защищенный, порт 5061)</option>
                    <option value="transport-udp">UDP (Стандартный, порт 5060)</option>
                </select>

                <button type="submit" style="background-color: #007bff;">Добавить номер</button>
            </form>
            <div id="extResult" class="result"></div>
        </div>

        <!-- Блок управления АТС (Reload) -->
        <div class="card" style="background-color: #e9f7ef; border: 1px solid #d4edda;">
            <h2>Управление АТС</h2>
            <p style="font-size: 0.9rem; color: #555;">После добавления или удаления номеров примените настройки в Asterisk.</p>
            <button id="reloadPbxBtn" style="background-color: #ffc107; color: #333; font-weight: bold;">Применить конфигурацию</button>
            <div id="reloadResult" class="result"></div>
        </div>

        <!-- Список существующих номеров -->
        <div class="card">
            <h2>Список номеров в системе</h2>
            <button id="loadExtsBtn" style="margin-bottom: 15px; background-color: #28a745;">Обновить список</button>
            <div id="extensionsContainer">
                <p style="color: #666; font-style: italic;">Загрузка списка...</p>
            </div>
        </div>
    </div>

    <script>
        // Генерация случайного безопасного пароля
        function generatePassword(length = 12) {
            const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
            let retVal = "";
            for (let i = 0, n = charset.length; i < length; ++i) {
                retVal += charset.charAt(Math.floor(Math.random() * n));
            }
            return retVal;
        }

        document.getElementById('generateBtn').addEventListener('click', () => {
            document.getElementById('extSecret').value = generatePassword(12);
        });

        // Создание номера
        document.getElementById('extForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const extension = parseInt(document.getElementById('extNumber').value);
            const secret = document.getElementById('extSecret').value;
            const callerid = document.getElementById('extCallerId').value;
            const transport = document.getElementById('extTransport').value;
            const resultDiv = document.getElementById('extResult');

            try {
                const response = await fetch('/api/extensions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ extension, secret, callerid, transport })
                });
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.style.color = 'green';
                    resultDiv.textContent = `Номер ${data.extension} успешно создан!`;
                    document.getElementById('extForm').reset();
                    loadExtensions();
                } else {
                    resultDiv.style.color = 'red';
                    resultDiv.textContent = `Ошибка: ${data.detail || 'Не удалось создать номер'}`;
                }
            } catch (err) {
                resultDiv.style.color = 'red';
                resultDiv.textContent = `Ошибка соединения с сервером`;
            }
        });

        // Загрузка и отображение номеров
        async function loadExtensions() {
            const container = document.getElementById('extensionsContainer');
            try {
                const response = await fetch('/api/extensions');
                const extensions = await response.json();

                if (extensions.length === 0) {
                    container.innerHTML = '<p>Номер пока не созданы.</p>';
                    return;
                }

                let html = '<table style="width:100%; border-collapse: collapse; margin-top: 10px;">';
                html += '<tr style="background: #f1f1f1; text-align: left;">';
                html += '<th style="padding: 8px; border: 1px solid #ddd;">Номер</th>';
                html += '<th style="padding: 8px; border: 1px solid #ddd;">Caller ID</th>';
                html += '<th style="padding: 8px; border: 1px solid #ddd;">Транспорт</th>';
                html += '<th style="padding: 8px; border: 1px solid #ddd;">Пароль</th>';
                html += '<th style="padding: 8px; border: 1px solid #ddd; text-align: center;">Действия</th>';
                html += '</tr>';
                
                extensions.forEach(ext => {
                    html += `<tr>`;
                    html += `<td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">${ext.extension}</td>`;
                    html += `<td style="padding: 8px; border: 1px solid #ddd;">${ext.callerid}</td>`;
                    html += `<td style="padding: 8px; border: 1px solid #ddd;">${ext.transport === 'transport-tls' ? 'TLS' : 'UDP'}</td>`;
                    // Поле пароля с возможностью скрыть/показать (глазик)
                    html += `<td style="padding: 8px; border: 1px solid #ddd;"><span class="secret-text" data-secret="${ext.secret}" style="font-family: monospace;">••••••••</span> <button onclick="toggleSecret(this)" style="padding: 2px 6px; font-size: 11px; margin-left: 5px; width: auto;">👁</button></td>`;
                    html += `<td style="padding: 8px; border: 1px solid #ddd; text-align: center;"><button onclick="deleteExtension(${ext.id})" style="background-color: #dc3545; color: white; padding: 4px 8px; font-size: 12px; width: auto;">Удалить</button></td>`;
                    html += `</tr>`;
                });
                html += '</table>';

                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<p style="color: red;">Не удалось загрузить список номеров.</p>';
            }
        }

        // Переключение видимости пароля
        window.toggleSecret = function(btn) {
            const span = btn.previousElementSibling;
            const currentSecret = span.getAttribute('data-secret');
            if (span.textContent === '••••••••') {
                span.textContent = currentSecret;
                btn.textContent = '🔒';
            } else {
                span.textContent = '••••••••';
                btn.textContent = '👁';
            }
        }

        // Удаление номера
        window.deleteExtension = async function(id) {
            if (!confirm('Вы уверены, что хотите удалить этот номер?')) return;

            try {
                const response = await fetch(`/api/extensions/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadExtensions();
                } else {
                    alert('Не удалось удалить номер');
                }
            } catch (err) {
                alert('Ошибка соединения с сервером');
            }
        }

        // Применение конфигурации Asterisk
        document.getElementById('reloadPbxBtn').addEventListener('click', async () => {
            const resultDiv = document.getElementById('reloadResult');
            resultDiv.style.color = '#555';
            resultDiv.textContent = 'Применение конфигурации...';

            try {
                const response = await fetch('/api/pbx/reload', { method: 'POST' });
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.style.color = 'green';
                    resultDiv.textContent = data.message;
                } else {
                    resultDiv.style.color = 'red';
                    resultDiv.textContent = `Ошибка: ${data.detail || 'Не удалось применить'}`;
                }
            } catch (err) {
                resultDiv.style.color = 'red';
                resultDiv.textContent = `Ошибка соединения с сервером`;
            }
        });

        document.getElementById('loadExtsBtn').addEventListener('click', loadExtensions);
        window.onload = loadExtensions;
    </script>
</body>
</html>
