# Coturn example configuration.
# Set your public IP, DNS name, and authentication credentials locally.
# Do not commit production values to Git.

listening-port=3478
fingerprint
listening-ip=0.0.0.0
min-port=49152
max-port=65535
realm=example.invalid

# For long-term credentials, configure a unique secret locally:
# use-auth-secret
# static-auth-secret=CHANGE_ME_USE_A_LONG_RANDOM_SECRET

# If the server is behind NAT, configure its public address locally:
# external-ip=YOUR_PUBLIC_IP

lt-cred-mech
user-quota=100
verbose
