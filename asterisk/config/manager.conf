;
; Asterisk Manager Interface (AMI)
;
; Configure a dedicated AMI account for the backend.
; Replace the placeholder secret with a long, unique value and keep it
; synchronized with AMI_SECRET in your local .env file.
;
#include "manager.d/*.conf"

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

[pbx_api]
secret = CHANGE_ME_USE_A_LONG_RANDOM_SECRET
deny = 0.0.0.0/0.0.0.0
; Adjust this subnet to match the Docker bridge network on your host.
permit = 172.17.0.0/255.255.0.0
read = system,call,log,verbose,command
write = command
