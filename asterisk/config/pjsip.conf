; PJSIP transport configuration for the Asterisk web PBX.
; Replace the example LAN subnet with your own local network.
; Install your own TLS certificate and private key at the paths below.

[system]
type=system

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/certs/fullchain.pem
priv_key_file=/etc/asterisk/certs/privkey.pem
method=tlsv1_2
local_net=192.168.1.0/24
; Set these only when deploying behind NAT, using your own public address:
; external_signaling_address=YOUR_PUBLIC_IP
; external_media_address=YOUR_PUBLIC_IP

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.1.0/24
; external_signaling_address=YOUR_PUBLIC_IP
; external_media_address=YOUR_PUBLIC_IP

#include "pjsip_users.conf"
